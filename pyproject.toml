[project]
name = "leanmd"
version = "1.0.0"
description = "EPUB/PDF to clean Markdown for AI agents and RAG pipelines. No cloud. Pure Python."
requires-python = ">=3.11"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "html2text>=2024.2.26",
    "pdfminer.six>=20240706",
]

[project.scripts]
leanmd = "leanmd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leanmd"]
